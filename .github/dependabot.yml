# Updates arrive as pull requests, where the pipeline tests them. Grouped,
# because a repository kept by one person has nothing to gain from getting
# seven of them on the same morning.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dependances:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
