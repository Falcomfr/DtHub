# Blank issues stay possible: the default template is offered first, but
# someone with a question or an idea must still be able to write one.
# With "false" and a single template, there was literally no way in.
blank_issues_enabled: true

# No pointer to Discussions: it is not enabled by default, verified via
# the GitHub API where the has_discussions field is false even on
# well-run projects like scrcpy. The link would have returned a 404 to
# the first person trying to open an issue.
contact_links:
  - name: Security vulnerability
    url: https://github.com/Falcomfr/DtHub/security/advisories/new
    about: In private, never in a public issue. See SECURITY.md.
