name: Report a problem
description: Something is not working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. The most useful thing is the
        **report** that the application composes for you: in DT Hub, the
        Windows tab, "Report a problem" button, then "Copy the report".

        It carries the version, your screens, the error and the useful
        lines from the log. Serial numbers, addresses and your Windows
        account name are stripped from it before it is filled in.

  - type: textarea
    id: attendu
    attributes:
      label: What you expected
      placeholder: Open two accounts side by side.
    validations:
      required: true

  - type: textarea
    id: produit
    attributes:
      label: What happened
      placeholder: The second window opens then closes immediately.
    validations:
      required: true

  - type: textarea
    id: rapport
    attributes:
      label: The report
      description: Pasted from the "Copy the report" button.
      render: text
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **If the report is not enough**, today's full log can be found
        through the "Open logs folder" button, in the same tab. You can
        attach the `dthub-<date>.log` file by dragging it here.

        Warning: this file is **not** redacted. It carries your phone's
        address, its serial number and your Windows account name. Only
        attach it if you accept that.
