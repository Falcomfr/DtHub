# Publishes the presentation page to GitHub Pages.
#
# The page lives in site/, and not in docs/: that one carries four hundred
# kilobytes of internal reasoning in French, and serving it would publish an
# engineering document in place of a download page.
#
# No gh-pages branch either: one more branch to keep for three files. The
# "GitHub Actions" route serves the artifact as it is, without going through
# Jekyll, so without .nojekyll or _config.yml.
#
# **Free on a public repository only.** On a private one, Pages requires a
# paid plan.
name: Page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/screenshots/**'
      - 'assets/app.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      contents: read

    # Two deployments do not overlap, and the second does not cancel the
    # first: a half deployed page would be worse than a late one.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployer.outputs.page_url }}

    steps:
      # Pinned by digest, like the three other pipelines, and all under the
      # "actions" organisation: the repository's rule is to borrow code from
      # nobody but GitHub.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The images live in assets/, the only versioned image folder, and the
      # page points at them by relative path: they have to be placed next to
      # it before the upload. The site is served under /DtHub/, where a
      # leading slash would give 404s.
      - name: Gather the page and its images
        run: |
          mkdir -p site/screenshots
          cp assets/screenshots/* site/screenshots/
          cp assets/app.png site/app.png

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - id: deployer
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
