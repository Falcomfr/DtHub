# Code analysis, by GitHub.
#
# It does not replace the tests: it looks for vulnerability patterns nobody
# writes on purpose, injection, deserialization, an unvalidated path. On a
# project that drives a phone over ADB, downloads two third party tools and
# replaces itself, that is a second pair of eyes at no cost.
#
# **Free on a public repository only.** On a private one it requires GitHub
# Advanced Security: that is one of the reasons for publishing straight to
# public rather than going through a private phase.
name: Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A flaw found out after the fact is not discovered on the next push:
  # CodeQL's pattern databases are updated without the code moving.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: analyse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyser:
    runs-on: windows-latest

    permissions:
      # The only ones filing the results calls for.
      security-events: write
      contents: read

    steps:
      # Pinned by digest, like the two other pipelines: a tag moves.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: csharp
          # Manual and not automatic: CodeQL's automatic build does not know
          # the .slnx format, and would fail to find what to build.
          build-mode: manual

      # Without "-warnaserror": the analysis has no business failing on a
      # formatting difference that the check pipeline already catches better
      # and faster.
      - name: Build
        run: dotnet build DtHub.slnx --configuration Release --nologo

      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
