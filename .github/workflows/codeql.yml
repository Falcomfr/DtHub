# Analyse de code, par GitHub.
#
# Elle ne remplace pas les épreuves : elle cherche des motifs de faille que
# personne n'écrit exprès, injection, désérialisation, chemin non validé. Sur un
# projet qui pilote un téléphone par ADB, télécharge deux outils tiers et se
# remplace lui-même, c'est un second regard qui ne coûte rien.
#
# **Gratuite sur un dépôt public seulement.** Sur un dépôt privé elle demande
# GitHub Advanced Security : c'est l'une des raisons de publier directement en
# public plutôt que de passer par une phase privée.
name: Analyse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Une faille connue après coup ne se découvre pas à la poussée suivante :
  # les bases de motifs de CodeQL sont mises à jour sans que le code bouge.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: analyse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyser:
    runs-on: windows-latest

    permissions:
      # Les seules que réclame le dépôt des résultats.
      security-events: write
      contents: read

    steps:
      # Épinglées par empreinte, comme les deux autres chaînes : une étiquette
      # se déplace.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: csharp
          # Manuel et non automatique : la compilation automatique de CodeQL ne
          # connaît pas le format .slnx, et échouerait à trouver quoi bâtir.
          build-mode: manual

      # Sans « -warnaserror » : l'analyse n'a pas à tomber sur un écart de forme
      # que la chaîne de contrôle attrape déjà mieux et plus vite.
      - name: Compiler
        run: dotnet build DtHub.slnx --configuration Release --nologo

      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
