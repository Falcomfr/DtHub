# Builds and tests on every push.
#
# The release pipeline only fires on a version tag. Between two releases, a
# broken build or a red test was visible only on the machine of whoever had
# written the code.
#
# Warnings are treated as errors: the repository has zero of them today, and
# that is a state which only holds if it is demanded.
name: Check

# Every branch, and not the main one alone: a push on a working branch was
# only checked at the moment a pull request was opened.
on:
  push:
  pull_request:

# The token has nothing to write. Without this block it inherits the
# repository setting, which often grants write, and this pipeline fires on
# contributor code.
permissions:
  contents: read

# A push that follows another cancels the previous one: there is no point
# testing a state that is already out of date.
concurrency:
  group: controle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controler:
    runs-on: windows-latest

    steps:
      # Pinned by digest and not by tag: a tag moves, and the header of the
      # release pipeline prides itself on borrowing code from nobody.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build DtHub.slnx --configuration Release --nologo -warnaserror

      - name: Test
        run: dotnet test DtHub.slnx --configuration Release --nologo --no-build

      # A real phone's serial number lived for weeks in a decision and two
      # test files, one of them the very test checking that the redaction of
      # diagnostic reports wipes it.
      #
      # **The allow list is kept by hand, and that is deliberate.** No rule
      # tells an invented serial from a recorded one reliably: the two have
      # the same shape. Requiring every value to be declared here forces the
      # question to be asked when a reading is added, which is the only
      # moment the answer is known.
      #
      # The real serial is never written in this file: only what is allowed
      # gets named.
      - name: Check that no device serial is left lying around
        shell: pwsh
        run: |
          $connus = @(
            'SERIAL0123456789'
            'MATERIEL123'
            'MATERIEL456'
            'ABC-DEF-123'
            '0123456789ABCDEF'
            'R58M12ABCDE'
          )

          $motif = 'adb-(?!' + ($connus -join '|') + ')[A-Z0-9]{10,}-'

          $fautifs = git ls-files |
            Where-Object { $_ -notmatch '\.(png|ico|exe|dll)$' } |
            Where-Object { (Get-Content $_ -Raw -ErrorAction SilentlyContinue) -cmatch $motif }

          if ($fautifs) {
            Write-Error "Undeclared device serial number in: $($fautifs -join ', ')"
            exit 1
          }

          Write-Host 'No undeclared device serial number in the tracked files.'

      # Dependabot reports once a month, this one reports on every push. The
      # two complete each other: one proposes an upgrade, the other refuses
      # to let through what is already known to be vulnerable.
      - name: Check the dependencies
        shell: pwsh
        run: |
          $sortie = dotnet list DtHub.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $sortie

          if ($sortie -match 'has the following vulnerable packages') {
            Write-Error 'Vulnerable dependency.'
            exit 1
          }

      # Last: a formatting difference must not hide a red test. The
      # .editorconfig described a project that did not exist, and this check
      # would have failed on one thousand nine hundred and fifty-six false
      # positives before it was put right.
      - name: Check the formatting
        run: dotnet format DtHub.slnx --verify-no-changes --no-restore
