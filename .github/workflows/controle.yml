# Compile et éprouve à chaque poussée.
#
# La chaîne de livraison ne se déclenche que sur une étiquette de version.
# Entre deux livraisons, une compilation cassée ou un test rouge ne se voyait
# que sur la machine de celui qui avait écrit le code.
#
# Les avertissements sont traités en erreurs : le dépôt en compte zéro
# aujourd'hui, et c'est un état qui ne se tient que s'il est exigé.
name: Contrôle

# Toutes les branches, et non la seule principale : une poussée sur une branche
# de travail n'était contrôlée qu'au moment d'ouvrir une demande de tirage.
on:
  push:
  pull_request:

# Le jeton n'a rien à écrire. Sans ce bloc, il hérite du réglage du dépôt, qui
# accorde souvent l'écriture, et cette chaîne se déclenche sur du code de
# contributeur.
permissions:
  contents: read

# Une poussée qui en suit une autre annule la précédente : rien ne sert
# d'éprouver un état déjà dépassé.
concurrency:
  group: controle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controler:
    runs-on: windows-latest

    steps:
      # Épinglées par empreinte et non par étiquette : une étiquette se
      # déplace, et l'en-tête de la chaîne de livraison se félicite de
      # n'emprunter de code à personne.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Compiler
        run: dotnet build DtHub.slnx --configuration Release --nologo -warnaserror

      - name: Éprouver
        run: dotnet test DtHub.slnx --configuration Release --nologo --no-build

      # Un numéro de série de vrai téléphone a vécu des semaines dans une
      # décision et deux fichiers d'épreuves, dont celui-là même qui vérifie que
      # la biffure des rapports de diagnostic l'efface.
      #
      # **La liste blanche se tient à la main, et c'est voulu.** Aucune règle
      # ne distingue de façon fiable un série inventé d'un série relevé : les
      # deux ont la même forme. Exiger que chaque valeur soit déclarée ici
      # oblige à se poser la question au moment où l'on ajoute un relevé, qui
      # est le seul moment où l'on connaît la réponse.
      #
      # Le vrai série n'est jamais écrit dans ce fichier : on ne nomme que ce
      # qu'on autorise.
      - name: Contrôler qu'aucun numéro de série ne traîne
        shell: pwsh
        run: |
          $connus = @(
            'SERIAL0123456789'
            'MATERIEL123'
            'MATERIEL456'
            'ABC-DEF-123'
            '0123456789ABCDEF'
            'R58M12ABCDE'
          )

          $motif = 'adb-(?!' + ($connus -join '|') + ')[A-Z0-9]{10,}-'

          $fautifs = git ls-files |
            Where-Object { $_ -notmatch '\.(png|ico|exe|dll)$' } |
            Where-Object { (Get-Content $_ -Raw -ErrorAction SilentlyContinue) -cmatch $motif }

          if ($fautifs) {
            Write-Error "Numéro de série d'appareil non déclaré dans : $($fautifs -join ', ')"
            exit 1
          }

          Write-Host 'Aucun numéro de série non déclaré dans les fichiers suivis.'

      # Dependabot signale une fois par mois ; celui-ci signale à chaque
      # poussée. Les deux se complètent : l'un propose une montée, l'autre
      # refuse de laisser passer ce qui est déjà connu comme vulnérable.
      - name: Contrôler les dépendances
        shell: pwsh
        run: |
          $sortie = dotnet list DtHub.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $sortie

          if ($sortie -match 'has the following vulnerable packages') {
            Write-Error 'Dépendance vulnérable.'
            exit 1
          }

      # En dernier : un écart de forme ne doit pas masquer une épreuve rouge.
      # Le .editorconfig décrivait un projet qui n'existait pas, et ce contrôle
      # aurait échoué sur mille neuf cent cinquante-six faux positifs avant
      # qu'il soit remis d'aplomb.
      - name: Contrôler la forme
        run: dotnet format DtHub.slnx --verify-no-changes --no-restore
