# Publie une version quand une étiquette « v… » est poussée.
#
# Rien d'automatique sur les commits : c'est l'étiquette qui décide. La marche
# à suivre est dans docs/LIVRAISON.md.
#
# Aucune action tierce : seules celles de GitHub, plus son propre outil en
# ligne de commande, déjà présent sur la machine de compilation. Une chaîne de
# livraison qui pose l'exécutable que des gens vont exécuter n'emprunte pas de
# code à des inconnus.
name: Livraison

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  livrer:
    runs-on: windows-latest

    # Le secret est copié ici parce qu'un « if » d'étape ne peut pas lire le
    # contexte des secrets. Vide, l'étape de signature est sautée.
    env:
      SIGNING_COMMAND: ${{ secrets.SIGNING_COMMAND }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version portée par l'étiquette
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "numero=$version" >> $env:GITHUB_OUTPUT

      - name: Éprouver
        run: dotnet test DtHub.slnx --configuration Release --nologo

      # Les options vivent dans le profil, seul endroit où elles sont écrites.
      - name: Publier
        run: >
          dotnet publish src/DtHub.App
          -p:PublishProfile=win-x64
          -p:Version=${{ steps.version.outputs.numero }}
          --output publication
          --nologo

      # Le contrôle d'identité qui suit ne lit que des métadonnées Windows :
      # un binaire dépendant du framework les porte à l'identique. Ces trois
      # mesures-ci regardent ce que le fichier est vraiment.
      - name: Contrôler que le binaire est autonome
        shell: pwsh
        run: |
          $fichiers = @(Get-ChildItem publication -File)
          if ($fichiers.Count -ne 1) {
            throw "La publication doit rendre un seul fichier, elle en rend $($fichiers.Count) : $($fichiers.Name -join ', ')"
          }

          # Un exécutable dépendant du .NET installé pèse environ cent
          # cinquante kilooctets. Le nôtre en fait soixante millions.
          $poids = (Get-Item publication/DtHub.exe).Length
          if ($poids -lt 40MB) {
            throw "DtHub.exe ne pèse que $([math]::Round($poids / 1MB, 1)) Mo : il n'embarque pas le runtime."
          }

          Write-Host "Un seul fichier, $([math]::Round($poids / 1MB, 1)) Mo, runtime embarqué."

      - name: Contrôler l'identité du binaire
        shell: pwsh
        run: |
          # Ce que Windows montre dans les propriétés du fichier, et ce que
          # SmartScreen cite quand il met en garde. Un exécutable qui ne porte
          # pas son nom se défend mal, et « DT Touch » a traîné là des semaines
          # après un renommage sans que rien ne le dise.
          $v = (Get-Item publication/DtHub.exe).VersionInfo
          $manques = @()

          if (-not $v.ProductName)     { $manques += 'ProductName' }
          if (-not $v.FileDescription) { $manques += 'FileDescription' }
          if (-not $v.CompanyName)     { $manques += 'CompanyName' }
          if ($v.FileDescription -eq 'DtHub') { $manques += 'FileDescription (nom de fichier au lieu d une phrase)' }

          Write-Host "ProductName     $($v.ProductName)"
          Write-Host "FileDescription $($v.FileDescription)"
          Write-Host "CompanyName     $($v.CompanyName)"
          Write-Host "FileVersion     $($v.FileVersion)"

          if ($manques) { throw "Identité incomplète : $($manques -join ', ')" }

      - name: Signer
        # Inerte tant qu'aucun certificat n'est configuré : la livraison sort
        # alors non signée, et Windows met en garde le temps que la réputation
        # se construise. Voir docs/CONFIANCE.md.
        #
        # Le secret SIGNING_COMMAND porte la ligne de signature complète, ce qui
        # laisse le choix du fournisseur sans rien changer ici : signtool avec un
        # certificat en nuage, ou l outil du prestataire.
        if: env.SIGNING_COMMAND != ''
        shell: pwsh
        run: |
          Invoke-Expression "$env:SIGNING_COMMAND publication/DtHub.exe"

          $s = Get-AuthenticodeSignature publication/DtHub.exe
          Write-Host "Signature : $($s.Status) $($s.SignerCertificate.Subject)"

          if ($s.Status -ne 'Valid') { throw "La signature n a pas pris : $($s.Status)" }

      - name: Empreinte
        shell: pwsh
        run: |
          $hash = (Get-FileHash publication/DtHub.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DtHub.exe" | Set-Content -NoNewline publication/DtHub.exe.sha256
          Write-Host "SHA256 $hash"

      - name: Note de version
        shell: pwsh
        run: |
          # La note vient du journal des modifications, section de la version
          # livrée. Écrite une fois, lue par le dépôt et par l'application.
          $lignes = Get-Content CHANGELOG.md
          $debut = $null
          $note = @()

          foreach ($ligne in $lignes) {
            if ($ligne -match '^## \[${{ steps.version.outputs.numero }}\]') { $debut = $true; continue }
            if ($debut -and $ligne -match '^## ') { break }
            if ($debut) { $note += $ligne }
          }

          if (-not $debut) { throw "Le journal ne décrit pas la version ${{ steps.version.outputs.numero }}." }

          ($note -join "`n").Trim() | Set-Content note.md

      - name: Livrer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          publication/DtHub.exe
          publication/DtHub.exe.sha256
          --title "DT Hub ${{ steps.version.outputs.numero }}"
          --notes-file note.md
