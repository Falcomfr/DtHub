# Publishes a release when a "v..." tag is pushed.
#
# Nothing automatic on commits: the tag decides. The procedure is in
# docs/LIVRAISON.md.
#
# No third party action: only GitHub's own, plus its command line tool,
# already present on the build machine. A release pipeline that lays down the
# executable people are going to run does not borrow code from strangers.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  livrer:
    runs-on: windows-latest

    # The secret is copied here because a step "if" cannot read the secrets
    # context. Empty, the signing step is skipped.
    env:
      SIGNING_COMMAND: ${{ secrets.SIGNING_COMMAND }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # The tag travels through the environment, never by interpolation into
      # the body of the script: a tag name allows a quote and a semicolon, and
      # PowerShell would run whatever had been put there. It already takes the
      # right to push a tag to make use of that, so this is not an elevation,
      # but the safe form costs nothing.
      - name: Version carried by the tag
        id: version
        shell: pwsh
        env:
          ETIQUETTE: ${{ github.ref_name }}
        run: |
          $version = $env:ETIQUETTE -replace '^v', ''

          # **The tag must say what the repository declares.** The project
          # lived with a VersionPrefix at 0.2.0 and thirty-seven feature
          # commits on top: tagging v0.2.0 would have shipped a binary whose
          # release notes lied. The pipeline already checks the size and the
          # identity of the file; it now also checks that it ships the number
          # it believes it does.
          $declare = (Select-String -Path Directory.Build.props `
            -Pattern '<VersionPrefix>(.+?)</VersionPrefix>').Matches[0].Groups[1].Value

          if ($version -ne $declare) {
            throw "The tag says $version, Directory.Build.props says $declare."
          }

          "numero=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test DtHub.slnx --configuration Release --nologo

      # The options live in the profile, the only place they are written.
      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.numero }}
        run: >
          dotnet publish src/DtHub.App
          -p:PublishProfile=win-x64
          "-p:Version=$env:VERSION"
          --output publication
          --nologo

      # The identity check that follows only reads Windows metadata: a
      # framework dependent binary carries it identically. These three
      # measurements look at what the file really is.
      - name: Check that the binary is self-contained
        shell: pwsh
        run: |
          $fichiers = @(Get-ChildItem publication -File)
          if ($fichiers.Count -ne 1) {
            throw "The publish must produce a single file, it produced $($fichiers.Count): $($fichiers.Name -join ', ')"
          }

          # An executable depending on the installed .NET weighs about a
          # hundred and fifty kilobytes. Ours weighs sixty million.
          $poids = (Get-Item publication/DtHub.exe).Length
          if ($poids -lt 40MB) {
            throw "DtHub.exe only weighs $([math]::Round($poids / 1MB, 1)) MB: it does not embed the runtime."
          }

          Write-Host "A single file, $([math]::Round($poids / 1MB, 1)) MB, runtime embedded."

      - name: Check the identity of the binary
        shell: pwsh
        run: |
          # What Windows shows in the file properties, and what SmartScreen
          # quotes when it warns. An executable that does not carry its name
          # defends itself poorly, and "DT Touch" lingered there for weeks
          # after a rename with nothing to say so.
          $v = (Get-Item publication/DtHub.exe).VersionInfo
          $manques = @()

          if (-not $v.ProductName)     { $manques += 'ProductName' }
          if (-not $v.FileDescription) { $manques += 'FileDescription' }
          if (-not $v.CompanyName)     { $manques += 'CompanyName' }
          if ($v.FileDescription -eq 'DtHub') { $manques += 'FileDescription (file name instead of a sentence)' }

          Write-Host "ProductName     $($v.ProductName)"
          Write-Host "FileDescription $($v.FileDescription)"
          Write-Host "CompanyName     $($v.CompanyName)"
          Write-Host "FileVersion     $($v.FileVersion)"

          if ($manques) { throw "Incomplete identity: $($manques -join ', ')" }

      - name: Sign
        # Inert as long as no certificate is configured: the release then
        # comes out unsigned, and Windows warns until the reputation builds
        # up. See docs/CONFIANCE.md.
        #
        # The SIGNING_COMMAND secret carries the complete signing line, which
        # leaves the choice of provider without changing anything here:
        # signtool with a cloud certificate, or the provider's own tool.
        if: env.SIGNING_COMMAND != ''
        shell: pwsh
        run: |
          Invoke-Expression "$env:SIGNING_COMMAND publication/DtHub.exe"

          $s = Get-AuthenticodeSignature publication/DtHub.exe
          Write-Host "Signature: $($s.Status) $($s.SignerCertificate.Subject)"

          if ($s.Status -ne 'Valid') { throw "The signature did not take: $($s.Status)" }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publication/DtHub.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DtHub.exe" | Set-Content -NoNewline publication/DtHub.exe.sha256
          Write-Host "SHA256 $hash"

      - name: Release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.numero }}
        run: |
          # The notes come from the changelog, the section of the version
          # being shipped. Written once, read by the repository and by the
          # application.
          $lignes = Get-Content CHANGELOG.md
          $debut = $null
          $note = @()

          foreach ($ligne in $lignes) {
            if ($ligne -match ('^## \[' + [regex]::Escape($env:VERSION) + '\]')) { $debut = $true; continue }
            if ($debut -and $ligne -match '^## ') { break }
            if ($debut) { $note += $ligne }
          }

          if (-not $debut) { throw "The changelog does not describe version $env:VERSION." }

          ($note -join "`n").Trim() | Set-Content note.md

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETTE: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.numero }}
        # **As a draft, and that is the antivirus inspection window.**
        # The application queries "/releases/latest", which ignores drafts:
        # nothing reaches anyone until it has been published. That is the only
        # moment when the exact artifact users will receive can be sent to
        # VirusTotal, rather than a local rebuild that does not have the same
        # checksum.
        #
        # Publishing is then one line, recorded in docs/LIVRAISON.md:
        # gh release edit <tag> --draft=false
        run: >
          gh release create $env:ETIQUETTE
          publication/DtHub.exe
          publication/DtHub.exe.sha256
          --title "DT Hub $env:VERSION"
          --notes-file note.md
          --draft
